<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage System Structure</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .structure-container {
            background-color: #e2e1b0;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }
        .structure-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .structure-btn {
            font-family: 'Times New Roman', Times, serif;
            padding: 15px;
            font-size: 22px;
            border: none;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .structure-btn:hover {
            background-color: #555;
        }
        .go-back-btn {
            font-family: 'Times New Roman', Times, serif;
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .go-back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="structure-container">
        <h1>Manage System Structure</h1>
        <div class="structure-buttons">
            <button class="structure-btn" onclick="window.location.href='/admin/manage-trainers'">Trainers</button>
            <button class="structure-btn" onclick="window.location.href='/admin/manage-gym-programs'">Gym Programs</button>
            <button class="structure-btn" onclick="window.location.href='/admin/manage-schedule'">Schedule</button>
        </div>
        <a href="/admin/dashboard" class="go-back-btn">Back to Dashboard</a>
    </div>
</body>
</html>
