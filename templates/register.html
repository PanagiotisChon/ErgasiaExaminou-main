<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #eeb31d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
            margin: 40px auto;
            position: relative;
        }
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 25px;
            cursor: pointer;
            color: #1b1a1a;
        }
        .close-button:hover {
            color: #e2e2e2;
        }
        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 16px;
            color: #555;
            text-align: left;
            margin-bottom: 5px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        select {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            background-color: #fff;
            color: #333;
        }
        select:focus {
            outline: none;
            border-color: #333;
            background-color: #f0f0f0;
        }
        button {
            font-family: 'Times New Roman', Times, serif;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            background-color: #333;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #555;
        }
        p {
            font-size: 14px;
            color: #666;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .flash-message {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <button class="close-button" onclick="window.location.href='/index.html'">&times;</button>
        <h1>Registration Request</h1>
        <div id="message"></div>
        <form id="registerForm">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstName" required>

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastName" required>

            <label for="country">Country:</label>
            <select id="country" name="country" required>
                <option value="" disabled selected>Select a country</option>
            </select>

            <label for="city">City:</label>
            <select id="city" name="city" required>
                <option value="" disabled selected>Select a city</option>
            </select>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Submit</button>
        </form>
        <p>Already have an account? <a href="login.html">Sign In</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            const response = await fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            });

            const result = await response.json();
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'flash-message';
            messageDiv.style.display = 'block'; // Εμφάνιση του μηνύματος

            if (response.ok) {
                messageDiv.classList.add('success');
                messageDiv.textContent = result.message;
            } 
            else {
                messageDiv.classList.add('danger');
                messageDiv.textContent = result.error;
            }
            setTimeout(function () {
                    const flashMessage = document.querySelector('.flash-message');
                    if (flashMessage) {
                        flashMessage.style.display = 'none';
                    }
                }, 5000);
        });
    
        // URL του API
        const countriesUrl = "https://countriesnow.space/api/v0.1/countries";
    
        // Ανάκτηση των χωρών από το API
        async function fetchCountries() {
            try {
                const response = await fetch(countriesUrl);
                const data = await response.json();
                populateCountries(data.data); // Πέρασμα της λίστας χωρών
            } catch (error) {
                console.error("Error fetching countries:", error);
            }
        }
    
        // Γέμισμα του dropdown για τις χώρες
        function populateCountries(countries) {
            const countrySelect = document.getElementById("country");
            countries.forEach((country) => {
                const option = document.createElement("option");
                option.value = country.country;
                option.textContent = country.country;
                countrySelect.appendChild(option);
            });
    
            // Προσθήκη event listener για αλλαγή χώρας
            countrySelect.addEventListener("change", (event) => {
                const selectedCountry = event.target.value;
                populateCities(countries, selectedCountry);
            });
        }
    
        // Γέμισμα του dropdown για τις πόλεις
        function populateCities(countries, selectedCountry) {
            const citySelect = document.getElementById("city");
            citySelect.innerHTML = '<option value="" disabled selected>Select a city</option>'; // Επαναφορά
    
            const country = countries.find((c) => c.country === selectedCountry);
            if (country && country.cities) {
                country.cities.forEach((city) => {
                    const option = document.createElement("option");
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            }
        }
    
        // Κλήση της συνάρτησης για να ανακτήσουμε τις χώρες κατά τη φόρτωση της σελίδας
        document.addEventListener("DOMContentLoaded", fetchCountries);
    </script>    
</body>
</html>
